<!DOCTYPE html>
<html>
<head>
    <title>Crypto Compass - Operational Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="metrics-container">
        <div class="metric-card">
            <h3>Active Users</h3>
            <div class="value" id="activeUsers">1</div>
            <div class="label">Current User</div>
        </div>
        <div class="metric-card">
            <h3>API Calls</h3>
            <div class="value" id="apiCalls">0</div>
            <div class="label">Today's requests</div>
        </div>
        <div class="metric-card">
            <h3>System Uptime</h3>
            <div class="value" id="uptime">100%</div>
            <div class="label">Last 7 days</div>
        </div>
        <div class="metric-card">
            <h3>Data Freshness</h3>
            <div class="value" id="dataAge">0s</div>
            <div class="label">Last update</div>
        </div>
    </div>

    <a href="coinsMain.html" class="button" style="position: fixed; top: 10px; right: 10px; background-color: #4CAF50;
    color: white; padding: 10px 20px; font-size: 18px; border-radius: 5px;">Back to Main</a>

    <script>
        // Check if user is logged in
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        }

        // Initialize metrics from session storage or create new ones
        const metrics = {
            apiCalls: parseInt(sessionStorage.getItem('apiCalls')) || 0,
            startTime: parseInt(sessionStorage.getItem('startTime')) || Date.now(),
            lastUpdate: parseInt(sessionStorage.getItem('lastUpdate')) || Date.now()
        };

        // Save initial state
        sessionStorage.setItem('startTime', metrics.startTime);
        sessionStorage.setItem('apiCalls', metrics.apiCalls);
        sessionStorage.setItem('lastUpdate', metrics.lastUpdate);

        function updateMetrics() {
            const now = Date.now();
            
            // Show API calls
            document.getElementById('apiCalls').textContent = metrics.apiCalls;
            
            // Calculate real uptime
            const uptime = ((now - metrics.startTime) / (7 * 24 * 60 * 60 * 1000)) * 100;
            document.getElementById('uptime').textContent = `${Math.min(100, uptime).toFixed(2)}%`;
            
            // Calculate data freshness
            const timeSinceLastUpdate = Math.floor((now - metrics.lastUpdate) / 1000);
            const minutes = Math.floor(timeSinceLastUpdate / 60);
            const seconds = timeSinceLastUpdate % 60;
            document.getElementById('dataAge').textContent = `${minutes}m ${seconds}s`;
        }

        // Update metrics every second for more accurate data freshness
        setInterval(updateMetrics, 1000);
        updateMetrics();
    </script>
</body>
</html>
